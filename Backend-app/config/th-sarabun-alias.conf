<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Map TH SarabunPSK to Sarabun -->
  <match target="pattern">
    <test name="family">
      <string>TH SarabunPSK</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Sarabun</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>TH Sarabun New</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Sarabun</string>
    </edit>
  </match>
</fontconfig>
