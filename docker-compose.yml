services:
  # ─── MySQL Database ───────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ontology_db
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "user", "--password=userpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_network

  # ─── phpMyAdmin (Database GUI) ────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M
    ports:
      - "8080:80"
    networks:
      - app_network

# ─────────────────────────────────────────────────────────────────────────────
# NOTE: Node.js Backend ถูกย้ายออกจาก Docker แล้ว
#       → รัน `node index.js` ใน backend/Backend-app บน Windows โดยตรง
#         เพื่อให้ใช้ PowerShell + Microsoft Word สำหรับแปลงเอกสารเป็น PDF ได้
# ─────────────────────────────────────────────────────────────────────────────

volumes:
  db_data:
    driver: local

networks:
  app_network:
    driver: bridge

